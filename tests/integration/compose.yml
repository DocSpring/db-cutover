services:
  blue:
    image: postgres:16
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    environment:
      POSTGRES_PASSWORD: synthetic-test-password
      POSTGRES_DB: cutover_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cutover_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  green:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: synthetic-test-password
      POSTGRES_DB: cutover_test
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cutover_test"]
      interval: 1s
      timeout: 5s
      retries: 30
